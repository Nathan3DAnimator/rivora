; Where the Real Engine talks to on the internet (src/endpoints.h). Embedded in realengine.exe at build time: changed,
; build again. To test with another file, REALENGINE_ENDPOINTS=<file>. Nothing of the user's goes here, and no GitHub
; token: the token lives in the relay (../tlender/tools/report_relay). The private key that signs the releases is
; OUTSIDE the repository (C:\Users\Player\.tlender-release\release_signing.key; the same key as the Tlender's).

[update]
; The public releases repository ("owner/repo"): the editor reads
; https://api.github.com/repos/<releases_repo>/releases/latest (no token: 60 queries per hour per IP).
; Private until the first release (the check then just finds nothing); public afterwards.
releases_repo = NathanLourencoPeixoto/realengine-releases
latest_url =
; The release package (asset): the first whose name matches (* = anything).
asset = RealEngine-*-win64.zip
; ECDSA P-256 public key (64 bytes X||Y in hex) that signs the package's SHA-256 (<package>.sig, made by
; realengine_updater --sign). Empty: never installs by itself; Update opens the release page.
pubkey = c3a4adf0ef10013cdfb12e128a613f18b26f34937491767d9a93a4c884decfe2b9d7831334fa3a72de96549e7a66672be210076ae743c930ffe073effb08379a

[assistant]
; The Assistant's knowledge base (src/assistant.c, notas-dev/assistente.md): a public repository's folder with the
; index.json made by tools/assistant_pack.py (nothing of the user's goes there: it is only read). Fetched on the first
; question (online) or kept on the computer (Download for offline use). REALENGINE_ASSISTANT_URL: another folder or URL.
base_url = https://raw.githubusercontent.com/NathanLourencoPeixoto/realengine-assistant/main

[reports]
; The relay of bug reports, crash reports and suggestions: the Tlender's Cloudflare Worker
; (../tlender/tools/report_relay/worker.js), shared: the field produto = realengine (and the body's first line
; "- Produto: Real Engine") tell the reports apart in the same reports repository, which the reports viewer
; (../reports-viewer) shows with the Tlender's. Empty: the reports stay on this computer (crashes/, bugReport/).
report_url = https://tlender-relay.nathan3danimator.workers.dev
app_key = suarpP-iagKSyv6u43daQeqRB7hR8OUT
produto = realengine

[support]
; (2026-11-23) The page where people support the engine (Help > Support Real Engine, About): the site's donation
; section. Empty: the menu item is hidden.
donate_url = https://createanimateplay.com
